<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tome</title>
    <link rel="stylesheet" href="/app/styles.css" />
    <!-- app.js (an ES module, implicitly deferred) registers the Alpine
         component on `alpine:init`; it appears before alpine.min.js so it runs
         first and its listener is in place when Alpine starts. -->
    <script type="module" src="/app/app.js"></script>
    <script defer src="/app/vendor/alpine.min.js"></script>
  </head>
  <body x-data="tomeApp" x-cloak>
    <header class="topbar">
      <a class="brand" href="?view=home" @click.prevent="showHome()">tome</a>
      <nav class="views">
        <a :class="{ active: view === 'home' }" href="?view=home" @click.prevent="showHome()">Home</a>
        <a :class="{ active: view === 'page' }" :href="pageHref()" @click.prevent="showPage()">Page</a>
        <a :class="{ active: view === 'board' }" href="?view=board" @click.prevent="showBoard()">Board</a>
        <a :class="{ active: view === 'backlog' }" href="?view=backlog" @click.prevent="showBacklog()">Backlog</a>
        <a :class="{ active: view === 'chains' }" href="?view=chains" @click.prevent="showChains()">Chains</a>
      </nav>
      <span class="hint" x-show="view === 'page'" x-text="pages.length + ' pages'"></span>
    </header>

    <!-- Page view: sidebar (vault tree) + content area -->
    <div class="layout" x-show="view === 'page'">
      <aside class="sidebar">
        <button type="button" class="new-page-btn" x-show="board.writable"
                @click="openNewPageModal()">+ New page</button>
        <nav class="tree">
          <template x-for="group of tree()" :key="group.project">
            <section class="tree-project">
              <button class="tree-project-head" @click="toggleProject(group.project)">
                <span class="twisty" x-text="collapsed[group.project] ? '▸' : '▾'"></span>
                <span x-text="group.project"></span>
              </button>
              <div class="tree-project-body" x-show="!collapsed[group.project]">
                <template x-for="folder of group.folders" :key="folder.name">
                  <div class="tree-folder">
                    <button type="button" class="tree-folder-name" x-show="folder.name"
                            @click="toggleFolder(group.project, folder)">
                      <span class="twisty" x-text="folderCollapsed(group.project, folder) ? '▸' : '▾'"></span>
                      <span x-text="folder.label"></span>
                    </button>
                    <ul x-show="!folderCollapsed(group.project, folder)">
                      <template x-for="pg of folder.pages" :key="pg.slug">
                        <li>
                          <a class="tree-link"
                             :class="{ current: pg.slug === currentSlug }"
                             :href="'?page=' + encodeURIComponent(pg.slug)"
                             :title="pg.title"
                             @click.prevent="loadPage(pg.slug)"
                             x-text="pg.title"></a>
                        </li>
                      </template>
                    </ul>
                  </div>
                </template>
              </div>
            </section>
          </template>
        </nav>
      </aside>

      <main class="page">
        <template x-if="pageError">
          <p class="error" x-text="pageError"></p>
        </template>
        <template x-if="!pageError && pageMeta">
          <article>
            <div class="fm-card">
              <div class="fm-head">
                <h1 x-show="!fmEditing" x-text="pageMeta.title || currentSlug"></h1>
                <input x-show="fmEditing" class="fm-title-input" type="text"
                       x-model="fmForm.title" placeholder="Title" />
                <div class="fm-head-actions">
                  <button class="edit-btn" x-show="board.writable && pageMeta.type === 'project' && !editing && !fmEditing"
                          @click="openNewPageModal(currentPage.slug)">New in project</button>
                  <button class="edit-btn" x-show="board.writable && !editing && !fmEditing"
                          @click="enterFmEdit()">Edit frontmatter</button>
                  <button class="edit-btn" x-show="board.writable && !fmEditing"
                          @click="enterEdit()" x-text="editorLoading ? 'Loading…' : 'Edit'"
                          :disabled="editorLoading"></button>
                  <a class="edit-link" :href="editUrl()" title="Open in VS Code">VS Code</a>
                </div>
              </div>

              <dl x-show="!fmEditing">
                <template x-for="[k, v] of fmRows(pageMeta)" :key="k">
                  <div class="fm-row">
                    <dt x-text="k"></dt>
                    <dd x-text="Array.isArray(v) ? v.join(', ') : v"></dd>
                  </div>
                </template>
              </dl>

              <div class="fm-form" x-show="fmEditing">
                <p class="editor-banner" :class="'editor-banner--' + fmBannerKind"
                   x-show="fmBanner" x-text="fmBanner"></p>
                <ul class="editor-findings" x-show="fmFindings.length">
                  <template x-for="f of fmFindings" :key="f.code + f.path + f.message">
                    <li x-text="f.path + ' — ' + f.code + ': ' + f.message"></li>
                  </template>
                </ul>

                <div class="fm-field">
                  <label>Description</label>
                  <input type="text" x-model="fmForm.description" maxlength="140" />
                  <span class="fm-counter" x-text="fmForm.description.length + '/140'"></span>
                </div>

                <div class="fm-field">
                  <label>Tags</label>
                  <div class="fm-tags">
                    <template x-for="(tag, i) of fmForm.tags" :key="tag">
                      <span class="fm-tag-chip">
                        <span x-text="tag"></span>
                        <button type="button" class="fm-tag-remove" @click="removeFmTag(i)">&times;</button>
                      </span>
                    </template>
                  </div>
                  <select @change="addFmTag($event.target.value); $event.target.value = ''">
                    <option value="" disabled selected>Add a tag…</option>
                    <template x-for="t of tagSuggestions()" :key="t">
                      <option :value="t" x-text="t"></option>
                    </template>
                  </select>
                </div>

                <dl class="fm-readonly">
                  <div class="fm-row fm-row--slug">
                    <dt>slug</dt>
                    <dd>
                      <span x-show="!renaming" x-text="currentPage.slug"></span>
                      <button type="button" class="rename-btn" x-show="!renaming"
                              @click="enterRename()">Rename…</button>
                      <div class="rename-box" x-show="renaming">
                        <input type="text" class="rename-input" x-model="renameSlug"
                               placeholder="new-slug"
                               @keydown.enter.prevent="saveRename()" />
                        <div class="rename-actions">
                          <button type="button" class="editor-btn-reload"
                                  x-show="renameBannerKind === 'conflict'"
                                  @click="reloadAfterFmConflict()">Reload</button>
                          <button type="button" class="editor-btn-cancel"
                                  @click="cancelRename()">Cancel</button>
                          <button type="button" class="rename-confirm"
                                  @click="saveRename()" :disabled="renameSaving"
                                  x-text="renameSaving ? 'Renaming…' : 'Rename'"></button>
                        </div>
                        <p class="rename-warning">Renames the file and rewrites every inbound
                          <code>[[wikilink]]</code> across the wiki, then jumps to the new URL.</p>
                        <p class="editor-banner" :class="'editor-banner--' + renameBannerKind"
                           x-show="renameBanner" x-text="renameBanner"></p>
                        <ul class="editor-findings" x-show="renameFindings.length">
                          <template x-for="f of renameFindings" :key="f.code + f.path + f.message">
                            <li x-text="f.path + ' — ' + f.code + ': ' + f.message"></li>
                          </template>
                        </ul>
                      </div>
                    </dd>
                  </div>
                  <div class="fm-row"><dt>type</dt><dd x-text="pageMeta.type"></dd></div>
                  <div class="fm-row"><dt>project</dt><dd x-text="currentPage.project"></dd></div>
                  <div class="fm-row"><dt>status</dt><dd x-text="pageMeta.status || '—'"></dd></div>
                  <div class="fm-row"><dt>created</dt><dd x-text="pageMeta.created"></dd></div>
                  <div class="fm-row"><dt>updated</dt><dd x-text="pageMeta.updated"></dd></div>
                </dl>
                <p class="fm-hint" x-show="pageMeta.status">Status is managed from the board / at the task level.</p>

                <div class="editor-actions">
                  <button class="editor-btn-reload" x-show="fmBannerKind === 'conflict'"
                          @click="reloadAfterFmConflict()">Reload</button>
                  <button class="editor-btn-cancel" @click="cancelFmEdit()">Cancel</button>
                  <button class="editor-btn-save" @click="saveFmEdit()" :disabled="fmSaving"
                          x-text="fmSaving ? 'Saving…' : 'Save'"></button>
                </div>
              </div>
            </div>

            <template x-if="!editing">
              <div class="markdown" x-html="pageHtml" @click="onContentClick($event)"></div>
            </template>

            <template x-if="!editing && !fmEditing && backlinks().length">
              <div class="backlinks">
                <h2 class="backlinks-title">Linked from</h2>
                <ul class="backlinks-list">
                  <template x-for="b of backlinks()" :key="b.slug">
                    <li><a class="backlinks-link" :href="'?page=' + encodeURIComponent(b.slug)"
                           @click.prevent="loadPage(b.slug)" x-text="b.title || b.slug"></a></li>
                  </template>
                </ul>
              </div>
            </template>

            <template x-if="editing">
              <div class="editor-pane">
                <p class="editor-banner" :class="'editor-banner--' + editorBannerKind"
                   x-show="editorBanner" x-text="editorBanner"></p>
                <ul class="editor-findings" x-show="editorFindings.length">
                  <template x-for="f of editorFindings" :key="f.code + f.path + f.message">
                    <li x-text="f.path + ' — ' + f.code + ': ' + f.message"></li>
                  </template>
                </ul>
                <div x-ref="editorMount"></div>
                <div class="editor-actions">
                  <button class="editor-btn-reload" x-show="editorBannerKind === 'conflict'"
                          @click="reloadAfterConflict()">Reload</button>
                  <button class="editor-btn-cancel" @click="cancelEdit()">Cancel</button>
                  <button class="editor-btn-save" @click="saveEdit()" :disabled="saving"
                          x-text="saving ? 'Saving…' : 'Save'"></button>
                </div>
              </div>
            </template>
          </article>
        </template>
      </main>
    </div>

    <!-- Hub / home view ([[wiki-hub-home]]) — the landing page: recently
         updated pages, a project roster, and every plan in flight. Every
         section is a pure derivation of index.json/board.json already in
         memory (home.js), so this needs no fetch of its own and renders
         identically on a frozen --export. -->
    <main class="home-wrap" x-show="view === 'home'">
      <section class="home-section">
        <h2 class="home-section-title">Recently updated</h2>
        <ul class="home-list">
          <template x-for="p of homeRecentPages()" :key="p.slug">
            <li class="home-list-item">
              <a :href="'?page=' + encodeURIComponent(p.slug)" @click.prevent="loadPage(p.slug)" x-text="p.title"></a>
              <span class="home-list-meta" x-text="p.project"></span>
              <span class="home-list-meta" x-text="p.updated"></span>
            </li>
          </template>
        </ul>
      </section>

      <section class="home-section">
        <h2 class="home-section-title">Projects</h2>
        <ul class="home-list">
          <template x-for="p of homeProjects()" :key="p.slug">
            <li class="home-list-item">
              <a :href="'?page=' + encodeURIComponent(p.slug)" @click.prevent="loadPage(p.slug)" x-text="p.title"></a>
              <span class="home-list-meta" x-text="p.count + (p.count === 1 ? ' page' : ' pages')"></span>
            </li>
          </template>
        </ul>
      </section>

      <section class="home-section">
        <h2 class="home-section-title">In flight</h2>
        <p class="home-empty" x-show="!homeInFlightPlans().length">No active or proposed plans.</p>
        <ul class="home-list">
          <template x-for="p of homeInFlightPlans()" :key="p.slug">
            <li class="home-list-item">
              <a :href="'?page=' + encodeURIComponent(p.slug)" @click.prevent="loadPage(p.slug)" x-text="p.title"></a>
              <span class="chip" x-text="p.status"></span>
              <span class="chip" x-show="p.task" x-text="p.task && p.task.status"></span>
            </li>
          </template>
        </ul>
      </section>
    </main>

    <!-- New page modal ([[page-creation]]) -->
    <div class="modal-overlay" x-show="newPageOpen" x-cloak @click.self="closeNewPageModal()"
         @keydown.escape.window="if (newPageOpen) closeNewPageModal()">
      <div class="modal" role="dialog" aria-modal="true" aria-label="New page">
        <div class="modal-head">
          <h2 x-text="newPageLinkTask ? 'New plan · linked to ' + newPageLinkTask.toUpperCase() : 'New page'"></h2>
          <button type="button" class="modal-close" @click="closeNewPageModal()">&times;</button>
        </div>

        <p class="editor-banner" :class="'editor-banner--' + newPageBannerKind"
           x-show="newPageBanner" x-text="newPageBanner"></p>
        <ul class="editor-findings" x-show="newPageFindings.length">
          <template x-for="f of newPageFindings" :key="f.code + f.path + f.message">
            <li x-text="f.path + ' — ' + f.code + ': ' + f.message"></li>
          </template>
        </ul>

        <div class="fm-field" x-show="!newPageLinkTask">
          <label>Type</label>
          <select x-model="newPageForm.type">
            <option value="" disabled>Choose a type…</option>
            <template x-for="t of typeEnum" :key="t">
              <option :value="t" x-text="t"></option>
            </template>
          </select>
        </div>

        <div class="fm-field" x-show="newPageForm.type !== 'project'">
          <label>Project</label>
          <select x-model="newPageForm.project">
            <option value="" disabled>Choose a project…</option>
            <template x-for="p of projectOptions()" :key="p.slug">
              <option :value="p.slug" x-text="p.title"></option>
            </template>
          </select>
        </div>

        <div class="fm-field">
          <label>Title</label>
          <input type="text" x-model="newPageForm.title" @input="onNewPageTitleInput()" placeholder="Title" />
        </div>

        <div class="fm-field">
          <label>Slug</label>
          <input type="text" x-model="newPageForm.slug" @input="newPageSlugTouched = true" placeholder="slug" />
          <span class="field-error" x-show="newPageSlugError()" x-text="newPageSlugError()"></span>
        </div>

        <div class="fm-field">
          <label>Description</label>
          <input type="text" x-model="newPageForm.description" maxlength="140" />
          <span class="fm-counter" x-text="newPageForm.description.length + '/140'"></span>
        </div>

        <div class="editor-actions">
          <button type="button" class="editor-btn-cancel" @click="closeNewPageModal()">Cancel</button>
          <button type="button" class="editor-btn-save" @click="saveNewPage()"
                  :disabled="newPageSaving || !newPageValid()"
                  x-text="newPageSaving ? 'Creating…' : 'Create'"></button>
        </div>
      </div>
    </div>

    <!-- New Task modal ([[in-ui-creation]]) — a bare kanban card via POST
         /api/task, no wiki page. "Save & create plan" hands off into the
         New Page modal above, pre-linked to the task just filed. -->
    <div class="modal-overlay" x-show="newTaskOpen" x-cloak @click.self="closeNewTaskModal()"
         @keydown.escape.window="if (newTaskOpen) closeNewTaskModal()">
      <div class="modal" role="dialog" aria-modal="true" aria-label="New task">
        <div class="modal-head">
          <h2>New task</h2>
          <button type="button" class="modal-close" @click="closeNewTaskModal()">&times;</button>
        </div>

        <p class="editor-banner" :class="'editor-banner--' + newTaskBannerKind"
           x-show="newTaskBanner" x-text="newTaskBanner"></p>

        <div class="fm-field">
          <label>Title</label>
          <input type="text" x-model="newTaskForm.title" placeholder="Title" />
        </div>

        <div class="fm-field">
          <label>Status</label>
          <select x-model="newTaskForm.status">
            <template x-for="s of newTaskStatusOptions()" :key="s">
              <option :value="s" x-text="s"></option>
            </template>
          </select>
        </div>

        <div class="fm-field">
          <label>Project</label>
          <select x-model="newTaskForm.project">
            <option value="">No project</option>
            <template x-for="p of projectOptions()" :key="p.slug">
              <option :value="p.slug" x-text="p.title"></option>
            </template>
          </select>
        </div>

        <div class="fm-field">
          <label>Priority</label>
          <select x-model="newTaskForm.priority">
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
        </div>

        <div class="fm-field">
          <label>Description</label>
          <input type="text" x-model="newTaskForm.description" maxlength="140" />
          <span class="fm-counter" x-text="newTaskForm.description.length + '/140'"></span>
        </div>

        <div class="editor-actions">
          <button type="button" class="editor-btn-cancel" @click="closeNewTaskModal()">Cancel</button>
          <button type="button" class="editor-btn-cancel" @click="saveNewTask({ thenCreatePlan: true })"
                  :disabled="newTaskSaving || !newTaskValid()"
                  x-text="newTaskSaving ? 'Saving…' : 'Save & create plan'"></button>
          <button type="button" class="editor-btn-save" @click="saveNewTask()"
                  :disabled="newTaskSaving || !newTaskValid()"
                  x-text="newTaskSaving ? 'Creating…' : 'Create'"></button>
        </div>
      </div>
    </div>

    <!-- Conflict resolver ([[conflict-resolution]]) — one dialog for all three
         entry points: a body edit, a frontmatter edit, or a stopped rebase.
         Left is always the user's side, right always the external one. -->
    <div class="modal-overlay" x-show="resolver" x-cloak>
      <div class="modal modal--wide resolver" role="dialog" aria-modal="true"
           aria-label="Resolve conflict" x-show="resolver">
        <template x-if="resolver">
          <div>
            <div class="resolver-head">
              <div>
                <h2 x-text="resolver.mode === 'git' ? 'Resolve a diverged history'
                                                    : 'Resolve this page'"></h2>
                <p class="resolver-source">
                  <span class="resolver-source-kind" x-text="resolver.source.headline"></span>
                  <span x-show="resolver.source.detail" x-text="' · ' + resolver.source.detail"></span>
                </p>
              </div>
              <div class="resolver-progress">
                <span x-show="resolverUndecided()"
                      x-text="resolverUndecided() + ' to decide'"></span>
                <span class="resolver-ready" x-show="!resolverUndecided()">ready to apply</span>
              </div>
            </div>

            <p class="resolver-file" x-show="resolver.mode === 'git'">
              <code x-text="resolver.path"></code>
              <span x-text="'— ' + resolver.state.files.length + ' file(s) left in this rebase'"></span>
            </p>

            <p class="editor-banner" :class="'editor-banner--' + resolver.bannerKind"
               x-show="resolver.banner" x-text="resolver.banner"></p>

            <div class="resolver-legend">
              <span class="resolver-col-label resolver-col-label--mine">Yours</span>
              <span class="resolver-col-label resolver-col-label--theirs"
                    x-text="resolver.mode === 'git' ? 'Remote' : 'On disk'"></span>
              <button type="button" class="resolver-bulk" x-show="resolverUndecided()"
                      @click="chooseAll('mine')">Keep all mine</button>
              <button type="button" class="resolver-bulk" x-show="resolverUndecided()"
                      @click="chooseAll('theirs')">Keep all theirs</button>
            </div>

            <!-- Frontmatter: one row per changed field, not a YAML diff. -->
            <div class="resolver-body" x-show="resolver.mode === 'frontmatter'">
              <p class="resolver-empty" x-show="!resolverFields().length">
                Nothing differs — both sides agree on every field.</p>
              <template x-for="hunk of resolverFields()" :key="hunk.id">
                <div>
                  <!-- Same split as the body: only a field both sides touched
                       is a question. -->
                  <template x-if="hunk.kind === 'conflict'">
                  <div class="resolver-hunk resolver-hunk--conflict">
                    <div class="resolver-hunk-label" x-text="hunk.label"></div>
                    <div class="resolver-sides">
                      <button type="button" class="resolver-side resolver-side--mine"
                              :class="{ chosen: hunk.choice === 'mine' }"
                              @click="chooseHunk(hunk, 'mine')">
                        <pre x-text="hunk.mine.join('\n') || '(empty)'"></pre>
                      </button>
                      <button type="button" class="resolver-side resolver-side--theirs"
                              :class="{ chosen: hunk.choice === 'theirs' }"
                              @click="chooseHunk(hunk, 'theirs')">
                        <pre x-text="hunk.theirs.join('\n') || '(empty)'"></pre>
                      </button>
                    </div>
                    <div class="resolver-actions-row">
                      <button type="button" :class="{ chosen: hunk.choice === 'mine' }"
                              @click="chooseHunk(hunk, 'mine')">Keep mine</button>
                      <button type="button" :class="{ chosen: hunk.choice === 'theirs' }"
                              @click="chooseHunk(hunk, 'theirs')">Keep theirs</button>
                      <button type="button" :class="{ chosen: hunk.choice === 'edit' }"
                              @click="chooseHunk(hunk, 'edit')">Edit…</button>
                    </div>
                    <input type="text" class="resolver-edit" x-show="hunk.choice === 'edit'"
                           x-model="hunk.editText" />
                  </div>
                  </template>

                  <template x-if="hunk.kind !== 'conflict'">
                  <div class="resolver-aside" :class="{ excluded: !oneSidedIncluded(hunk) }">
                    <div class="resolver-aside-head">
                      <span class="resolver-aside-field" x-text="hunk.label"></span>
                      <span x-text="oneSidedSource(hunk)"></span>
                      <span class="resolver-aside-state"
                            x-text="oneSidedIncluded(hunk) ? 'included' : 'excluded'"></span>
                      <button type="button" class="resolver-aside-toggle"
                              @click="toggleOneSided(hunk)"
                              x-text="oneSidedIncluded(hunk) ? 'Exclude' : 'Include'"></button>
                    </div>
                    <pre class="resolver-del" x-text="prefixed(hunk.base, '-')"></pre>
                    <pre class="resolver-add" x-text="prefixed(oneSidedAdded(hunk), '+')"></pre>
                  </div>
                  </template>
                </div>
              </template>
            </div>

            <!-- Body / git: line hunks, unchanged runs collapsed. -->
            <div class="resolver-body" x-show="resolver.mode !== 'frontmatter'">
              <template x-for="row of resolverRows()" :key="row.key">
                <div>
                  <template x-if="row.part === 'context'">
                    <pre class="resolver-context" x-text="row.lines.join('\n')"></pre>
                  </template>
                  <template x-if="row.part === 'gap'">
                    <div class="resolver-gap" x-text="'⋯ ' + row.elided + ' unchanged lines ⋯'"></div>
                  </template>

                  <!-- A true conflict: both sides changed it, so it gets the
                       full picker and blocks Apply until answered. -->
                  <template x-if="row.part === 'hunk' && row.hunk.kind === 'conflict'">
                  <div class="resolver-hunk resolver-hunk--conflict">
                    <div class="resolver-hunk-label">Both sides changed this</div>
                    <div class="resolver-sides">
                      <button type="button" class="resolver-side resolver-side--mine"
                              :class="{ chosen: row.hunk.choice === 'mine' }"
                              @click="chooseHunk(row.hunk, 'mine')">
                        <pre x-text="row.hunk.mine.join('\n') || '(nothing)'"></pre>
                      </button>
                      <button type="button" class="resolver-side resolver-side--theirs"
                              :class="{ chosen: row.hunk.choice === 'theirs' }"
                              @click="chooseHunk(row.hunk, 'theirs')">
                        <pre x-text="row.hunk.theirs.join('\n') || '(nothing)'"></pre>
                      </button>
                    </div>
                    <div class="resolver-actions-row">
                      <button type="button" :class="{ chosen: row.hunk.choice === 'mine' }"
                              @click="chooseHunk(row.hunk, 'mine')">Keep mine</button>
                      <button type="button" :class="{ chosen: row.hunk.choice === 'theirs' }"
                              @click="chooseHunk(row.hunk, 'theirs')">Keep theirs</button>
                      <button type="button" :class="{ chosen: row.hunk.choice === 'both' }"
                              @click="chooseHunk(row.hunk, 'both')">Keep both</button>
                      <button type="button" :class="{ chosen: row.hunk.choice === 'edit' }"
                              @click="chooseHunk(row.hunk, 'edit')">Edit…</button>
                    </div>
                    <textarea class="resolver-edit" rows="4" x-show="row.hunk.choice === 'edit'"
                              x-model="row.hunk.editText"></textarea>
                  </div>
                  </template>

                  <!-- Only one side changed it: already answered, so this
                       reports rather than asks — a -/+ diff and one toggle. -->
                  <template x-if="row.part === 'hunk' && row.hunk.kind !== 'conflict'">
                  <div class="resolver-aside" :class="{ excluded: !oneSidedIncluded(row.hunk) }">
                    <div class="resolver-aside-head">
                      <span x-text="oneSidedSource(row.hunk)"></span>
                      <span class="resolver-aside-state"
                            x-text="oneSidedIncluded(row.hunk) ? 'included' : 'excluded'"></span>
                      <button type="button" class="resolver-aside-toggle"
                              @click="toggleOneSided(row.hunk)"
                              x-text="oneSidedIncluded(row.hunk) ? 'Exclude' : 'Include'"></button>
                    </div>
                    <pre class="resolver-del" x-show="row.hunk.base.length"
                         x-text="prefixed(row.hunk.base, '-')"></pre>
                    <pre class="resolver-add" x-show="oneSidedAdded(row.hunk).length"
                         x-text="prefixed(oneSidedAdded(row.hunk), '+')"></pre>
                  </div>
                  </template>
                </div>
              </template>
            </div>

            <p class="resolver-warning" x-show="resolver.mode === 'git'">
              The vault is stopped mid-rebase. Resolving every file continues it;
              <strong>Abort</strong> puts the tree back exactly as it was before the pull.
            </p>

            <div class="editor-actions">
              <button type="button" class="editor-btn-cancel"
                      x-show="resolver.mode !== 'git'"
                      @click="closeResolver()">Cancel</button>
              <button type="button" class="editor-btn-cancel"
                      x-show="resolver.mode === 'git'" :disabled="resolver.busy"
                      @click="closeResolver()">Later</button>
              <button type="button" class="editor-btn-cancel"
                      x-show="resolver.mode === 'git'" :disabled="resolver.busy"
                      @click="abortRebase()">Abort rebase</button>
              <!-- `> 0` is load-bearing: Alpine only drops a boolean attribute
                   for null/undefined/false, so a bare count of 0 would leave
                   this disabled forever. -->
              <button type="button" class="editor-btn-save" @click="applyResolution()"
                      :disabled="resolver.busy || resolverUndecided() > 0"
                      x-text="resolver.busy ? 'Applying…'
                            : resolver.mode === 'git' ? 'Resolve file' : 'Apply & save'"></button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Board/backlog/chains share one layout: main content plus, when a task
         panel is open ([[task-detail-panel]]), a fixed-width side track. The
         three x-show'd <main>s below are the layout's first flex child; the
         panel and its narrow-viewport scrim are the second. -->
    <div class="board-layout" x-show="view === 'board' || view === 'backlog' || view === 'chains'">
    <div class="board-layout-main">
    <!-- Board view (full-width) -->
    <main class="board-wrap" x-show="view === 'board'">
      <div class="board-toolbar">
        <label>
          Project
          <select x-model="projectFilter">
            <option value="__all__">All projects</option>
            <template x-for="p of projects()" :key="p">
              <option :value="p" x-text="p"></option>
            </template>
          </select>
        </label>
        <label>
          Sort
          <select x-model="sortMode">
            <option value="manual">Manual</option>
            <option value="priority">Priority</option>
            <option value="title">Title</option>
          </select>
        </label>
        <button type="button" class="new-page-btn" x-show="board.writable"
                @click="openNewTaskModal()">+ New task</button>
        <span class="chip chip--readonly" x-show="!board.writable">read-only</span>
        <span class="total" x-text="visibleCards().length + ' tasks'"></span>
      </div>
      <p class="board-error" x-show="boardError" x-text="boardError"></p>
      <div class="board-columns">
        <template x-for="status of columns()" :key="status">
          <section class="board-column">
            <div class="col-head">
              <h2 x-text="status"></h2>
              <span class="count" x-text="cardsFor(status).length"></span>
            </div>
            <div class="col-body"
                 @dragover.prevent="onDragOver($event, status)"
                 @dragleave="onDragLeave($event)"
                 @drop.prevent="onDrop($event, status)">
              <div class="drop-line" x-show="cardsFor(status).length === 0
                     && dropTarget && dropTarget.status === status"></div>
              <template x-for="(card, idx) of cardsFor(status)" :key="card.id">
                <div>
                  <div class="drop-line" x-show="dropIndicator(status, card, idx) === 'above'"></div>
                  <article class="card"
                           :data-card-id="card.id"
                           :draggable="board.writable && sortMode === 'manual'"
                           :class="{ dragging: draggingId === card.id, moving: movingCardId === card.id,
                                     selected: card.id === currentTaskId }"
                           @dragstart="onDragStart($event, card)"
                           @dragend="onDragEnd"
                           @click="openTask(card.id)">
                    <div class="card-meta">
                      <span class="card-id" x-text="card.rawId"></span>
                      <span class="card-prio" :data-prio="card.priority" x-show="card.priority" x-text="card.priority"></span>
                    </div>
                    <div class="card-title" x-text="card.title"></div>
                    <div class="card-chips">
                      <span class="chip" x-show="card.project" x-text="card.project"></span>
                      <span class="chip chip--milestone" x-show="card.milestone" x-text="card.milestone"></span>
                    </div>
                    <button type="button" class="card-action" x-show="board.writable"
                            @click.stop="deferCard(card)">Defer</button>
                  </article>
                  <div class="drop-line" x-show="dropIndicator(status, card, idx) === 'below'"></div>
                </div>
              </template>
            </div>
          </section>
        </template>
      </div>
    </main>

    <!-- Backlog view (full-width, single sortable list) — [[deferred-backlog]] -->
    <main class="board-wrap" x-show="view === 'backlog'">
      <div class="board-toolbar">
        <label>
          Sort
          <select x-model="sortMode">
            <option value="manual">Manual</option>
            <option value="priority">Priority</option>
            <option value="title">Title</option>
          </select>
        </label>
        <button type="button" class="new-page-btn" x-show="board.writable"
                @click="openNewTaskModal({ fromBacklog: true })">+ New item</button>
        <span class="chip chip--readonly" x-show="!board.writable">read-only</span>
        <span class="total" x-text="cardsFor(board.backlogStatus).length + ' tasks'"></span>
      </div>
      <p class="board-error" x-show="boardError" x-text="boardError"></p>
      <div class="backlog-list col-body"
           @dragover.prevent="onDragOver($event, board.backlogStatus)"
           @dragleave="onDragLeave($event)"
           @drop.prevent="onDrop($event, board.backlogStatus)">
        <div class="drop-line" x-show="cardsFor(board.backlogStatus).length === 0
               && dropTarget && dropTarget.status === board.backlogStatus"></div>
        <template x-for="(card, idx) of cardsFor(board.backlogStatus)" :key="card.id">
          <div>
            <div class="drop-line" x-show="dropIndicator(board.backlogStatus, card, idx) === 'above'"></div>
            <article class="card"
                     :data-card-id="card.id"
                     :draggable="board.writable && sortMode === 'manual'"
                     :class="{ dragging: draggingId === card.id, moving: movingCardId === card.id,
                               selected: card.id === currentTaskId }"
                     @dragstart="onDragStart($event, card)"
                     @dragend="onDragEnd"
                     @click="openTask(card.id)">
              <div class="card-meta">
                <span class="card-id" x-text="card.rawId"></span>
                <span class="card-prio" :data-prio="card.priority" x-show="card.priority" x-text="card.priority"></span>
              </div>
              <div class="card-title" x-text="card.title"></div>
              <div class="card-chips">
                <span class="chip" x-show="card.project" x-text="card.project"></span>
                <span class="chip chip--milestone" x-show="card.milestone" x-text="card.milestone"></span>
              </div>
              <button type="button" class="card-action" x-show="board.writable"
                      @click.stop="promoteCard(card)">Promote →</button>
            </article>
            <div class="drop-line" x-show="dropIndicator(board.backlogStatus, card, idx) === 'below'"></div>
          </div>
        </template>
      </div>
    </main>

    <!-- Dependency chains view ([[dependency-chains]]) — read-only, computed
         client-side from the same board.json cards by chains.js; no fetch,
         no new server route, identical on a --export snapshot. -->
    <main class="board-wrap chains-wrap" x-show="view === 'chains'">
      <div class="board-toolbar">
        <span class="total"
              x-text="chainsData().chains.length + ' chain' + (chainsData().chains.length === 1 ? '' : 's')
                + ' · ' + chainsData().unchained.length + ' unchained'"></span>
      </div>

      <p class="chains-empty" x-show="!hasAnyDependency()">
        No task on the board carries a dependency yet. Set one with
        <code>tome task edit &lt;id&gt; --dep &lt;id&gt;</code>.
      </p>

      <template x-if="hasAnyDependency()">
        <div>
          <template x-for="(chain, i) of chainsData().chains" :key="chain.id">
            <section class="chain-group">
              <h2 class="chain-title"
                  x-text="'Chain ' + (i + 1) + ' — ' + chain.size + (chain.size === 1 ? ' task' : ' tasks')"></h2>
              <div class="chain-rows">
                <template x-for="row of chain.rows" :key="row.key">
                  <div class="chain-row"
                       :class="{ 'chain-row--backref': row.backref, 'chain-row--offboard': row.offboard,
                                 'chain-row--current': row.id === currentTaskId }"
                       @click="!row.offboard && openTask(row.id)">
                    <span class="chain-prefix" x-text="row.prefix"></span>
                    <span class="chain-backref-mark" x-show="row.backref" title="Shown in full above">&uarr;</span>
                    <span class="chain-id" x-text="row.rawId"></span>
                    <span class="chain-row-title"
                          x-text="row.offboard ? '(not on this board)' : row.title"></span>
                    <span class="card-prio" :data-prio="row.card && row.card.priority"
                          x-show="row.card && row.card.priority" x-text="row.card && row.card.priority"></span>
                    <span class="chip" x-show="row.card && row.card.status" x-text="row.card && row.card.status"></span>
                    <span class="chain-deps" x-show="row.deps.length"
                          x-text="'needs ' + row.deps.map(depLabel).join(', ')"></span>
                  </div>
                </template>
              </div>
            </section>
          </template>

          <section class="chain-group chain-unchained" x-show="chainsData().unchained.length">
            <button type="button" class="chain-unchained-toggle"
                    @click="chainsUnchainedOpen = !chainsUnchainedOpen">
              <span class="twisty" x-text="chainsUnchainedOpen ? '▾' : '▸'"></span>
              <span x-text="chainsData().unchained.length + ' unchained task'
                + (chainsData().unchained.length === 1 ? '' : 's')"></span>
            </button>
            <div class="chain-rows" x-show="chainsUnchainedOpen">
              <template x-for="card of chainsData().unchained" :key="card.id">
                <div class="chain-row" :class="{ 'chain-row--current': card.id === currentTaskId }"
                     @click="openTask(card.id)">
                  <span class="chain-id" x-text="card.rawId"></span>
                  <span class="chain-row-title" x-text="card.title"></span>
                </div>
              </template>
            </div>
          </section>
        </div>
      </template>
    </main>
    </div>

    <!-- Task-detail panel ([[task-detail-panel]]) — a layer over whichever
         base view (board/backlog/chains) is active above, rendered entirely
         from the clicked card's board.json entry; no fetch on open, identical
         on a frozen static export. The scrim is only visible (via CSS) below
         the narrow-viewport breakpoint, where the panel becomes a full-width
         overlay instead of a side track.

         Its fields are editable on a live serve ([[task-editing]]): there is
         no edit mode, each field carries its own affordance, and everything
         below is gated on `pane.editable` — false on a static export and
         false for the on-disk pane. That pane is the whole point of rendering
         this body inside `x-for="pane of taskPanes()"` rather than once: on a
         409 the very same markup is instantiated a second time against the
         card the server refused the write over, so "what you'd overwrite"
         costs one extra data source instead of a second read-only view. -->
    <div class="task-panel-scrim" x-show="currentTaskId" @click="closeTaskPanel()"></div>
    <aside class="task-panel" :class="{ 'task-panel--conflict': taskConflict }"
           x-show="currentTaskId" @keydown.escape.window="if (currentTaskId) closeTaskPanel()">
      <div class="task-panel-head">
        <span class="card-id" x-show="currentTask()" x-text="currentTask() && currentTask().rawId"></span>
        <span class="card-prio" :data-prio="currentTask() && currentTask().priority"
              x-show="currentTask() && currentTask().priority" x-text="currentTask() && currentTask().priority"></span>
        <button type="button" class="task-panel-close" @click="closeTaskPanel()" aria-label="Close task panel">&times;</button>
      </div>
      <template x-if="taskErrorMessage()">
        <p class="error" x-text="taskErrorMessage()"></p>
      </template>

      <p class="task-banner" :class="'task-banner--' + taskBannerKind"
         x-show="taskBanner && currentTask()" x-text="taskBanner"></p>

      <!-- Outside the pane loop: one datalist, or the two panes would render
           duplicate ids for it. -->
      <datalist id="task-label-suggestions">
        <template x-for="l of labelSuggestions()" :key="l">
          <option :value="l"></option>
        </template>
      </datalist>

      <div class="task-panes" x-show="!taskErrorMessage() && currentTask()">
        <template x-for="pane of taskPanes()" :key="pane.key">
          <article class="task-detail" :class="{ 'task-detail--disk': pane.disk }"
                   x-data="{ get editable() { return !pane.disk && taskWritable(); } }">

            <div class="task-pane-head" x-show="pane.disk">
              <h2>On disk</h2>
              <span class="task-pane-when" x-text="taskConflictAgo()"></span>
              <button type="button" class="task-pane-dismiss" @click="dismissTaskConflict()">Dismiss</button>
            </div>

            <div class="fm-card">
              <div class="fm-head">
                <!-- Title: click to edit in place; a plain input, since a
                     title is one line and never markdown. -->
                <template x-if="!taskEditing('title') || pane.disk">
                  <h1 class="task-title" :class="{ 'task-title--editable': editable }"
                      @click="editable && beginTaskEdit('title', pane.card.title)"
                      x-text="pane.card.title"></h1>
                </template>
                <template x-if="taskEditing('title') && !pane.disk">
                  <div class="task-field-edit">
                    <input type="text" x-model="taskEdit.value"
                           @keydown.enter="saveTaskEdit()" @keydown.escape="cancelTaskEdit()" />
                    <div class="task-field-actions">
                      <button type="button" class="editor-btn-save" :disabled="!!taskSavingField"
                              @click="saveTaskEdit()">Save</button>
                      <button type="button" @click="cancelTaskEdit()">Cancel</button>
                    </div>
                  </div>
                </template>
                <div class="task-pane-take" x-show="pane.disk">
                  <button type="button" @click="copyText(pane.card.title)" title="Copy">&#9099;</button>
                  <button type="button" @click="takeDiskText('title', pane.card.title)"
                          title="Take the disk version">&larr;</button>
                </div>
              </div>
              <dl>
                <div class="fm-row" x-show="pane.card.status || editable">
                  <dt>status</dt>
                  <dd>
                    <select x-show="editable" class="task-select"
                            :value="pane.card.status" @change="setTaskStatus($event.target.value)">
                      <template x-for="s of board.statuses" :key="s">
                        <option :value="s" :selected="s === pane.card.status" x-text="s"></option>
                      </template>
                    </select>
                    <span x-show="!editable" x-text="pane.card.status"></span>
                  </dd>
                </div>
                <div class="fm-row" x-show="pane.card.priority || editable">
                  <dt>priority</dt>
                  <dd>
                    <select x-show="editable" class="task-select"
                            :value="pane.card.priority" @change="setTaskPriority($event.target.value)">
                      <template x-for="p of ['high', 'medium', 'low']" :key="p">
                        <option :value="p" :selected="p === pane.card.priority" x-text="p"></option>
                      </template>
                    </select>
                    <span x-show="!editable" x-text="pane.card.priority"></span>
                  </dd>
                </div>
                <!-- project is derived from the project: label, so it's set by
                     editing labels below rather than by a field of its own. -->
                <div class="fm-row" x-show="pane.card.project">
                  <dt>project</dt><dd x-text="pane.card.project"></dd>
                </div>
                <div class="fm-row" x-show="pane.card.milestone || editable">
                  <dt>milestone</dt>
                  <dd>
                    <select x-show="editable" class="task-select"
                            :value="pane.card.milestone || ''" @change="setTaskMilestone($event.target.value)">
                      <option value="">(none)</option>
                      <template x-for="m of milestoneOptions()" :key="m">
                        <option :value="m" :selected="m === pane.card.milestone" x-text="m"></option>
                      </template>
                    </select>
                    <span x-show="!editable" x-text="pane.card.milestone"></span>
                  </dd>
                </div>
                <div class="fm-row" x-show="pane.card.agent">
                  <dt>agent</dt><dd x-text="pane.card.agent"></dd>
                </div>
                <div class="fm-row" x-show="pane.card.assignee.length || editable">
                  <dt>assignee</dt>
                  <dd>
                    <!-- Set-and-replace, not chips: backlog.md has no flag
                         that clears an assignee, so a remove affordance would
                         promise something it can't deliver. -->
                    <input x-show="editable" type="text" class="task-inline-input"
                           :value="pane.card.assignee.join(', ')"
                           @change="setTaskAssignee($event.target.value)"
                           @keydown.enter="$event.target.blur()" />
                    <span x-show="!editable" x-text="pane.card.assignee.join(', ')"></span>
                  </dd>
                </div>
                <div class="fm-row" x-show="pane.card.labels.length || editable">
                  <dt>labels</dt>
                  <dd class="task-chips">
                    <template x-for="label of pane.card.labels" :key="label">
                      <span class="chip">
                        <span x-text="label"></span>
                        <button type="button" class="chip-remove" x-show="editable"
                                @click="removeTaskLabel(label)" aria-label="Remove label">&times;</button>
                      </span>
                    </template>
                    <input x-show="editable" type="text" class="task-inline-input task-label-add"
                           list="task-label-suggestions" placeholder="+ label"
                           x-model="taskLabelDraft"
                           @change="addTaskLabel(taskLabelDraft)"
                           @keydown.enter="addTaskLabel(taskLabelDraft)" />
                  </dd>
                </div>
                <!-- Read-only by design: backlog.md owns the dates, drag owns
                     the ordinal, and `references` is the link a plan is found
                     by ([[task-editing]]). -->
                <div class="fm-row" x-show="pane.card.created">
                  <dt>created</dt><dd x-text="pane.card.created"></dd>
                </div>
                <div class="fm-row" x-show="pane.card.updated">
                  <dt>updated</dt><dd x-text="pane.card.updated"></dd>
                </div>
              </dl>
              <p class="task-wiki-link" x-show="!pane.disk && taskWikiPage(pane.card)">
                <a :href="'?page=' + encodeURIComponent(taskWikiPage(pane.card)?.slug)"
                   @click.prevent="loadPage(taskWikiPage(pane.card).slug)">
                  View wiki page: <span x-text="taskWikiPage(pane.card)?.title"></span>
                </a>
              </p>
            </div>

            <section class="task-block" x-show="pane.card.description || editable">
              <h2>
                Description
                <span class="task-block-actions">
                  <button type="button" x-show="editable && !taskEditing('description')"
                          @click="beginTaskEdit('description', pane.card.description)"
                          title="Edit">&#9998;</button>
                  <template x-if="pane.disk">
                    <span>
                      <button type="button" @click="copyText(pane.card.description)" title="Copy">&#9099;</button>
                      <button type="button" @click="takeDiskText('description', pane.card.description)"
                              title="Take the disk version">&larr;</button>
                    </span>
                  </template>
                </span>
              </h2>
              <template x-if="taskEditing('description') && !pane.disk">
                <div class="task-field-edit">
                  <textarea rows="5" x-model="taskEdit.value" @keydown.escape="cancelTaskEdit()"></textarea>
                  <div class="task-field-actions">
                    <button type="button" class="editor-btn-save" :disabled="!!taskSavingField"
                            @click="saveTaskEdit()">Save</button>
                    <button type="button" @click="cancelTaskEdit()">Cancel</button>
                  </div>
                </div>
              </template>
              <div class="markdown task-description" x-show="!taskEditing('description') || pane.disk"
                   x-html="renderTaskMarkdown(pane.card.description)" @click="onContentClick($event)"></div>
            </section>

            <section class="task-acs" x-show="pane.card.acceptanceCriteria.length || editable">
              <h2>
                Acceptance Criteria
                <span class="task-block-actions" x-show="pane.disk">
                  <button type="button" title="Copy"
                          @click="copyText(pane.card.acceptanceCriteria
                            .map((a, i) => `- [${a.checked ? 'x' : ' '}] #${i + 1} ${a.text}`).join('\n'))">&#9099;</button>
                </span>
              </h2>
              <ul>
                <template x-for="(ac, i) of pane.card.acceptanceCriteria" :key="i">
                  <li class="task-ac" :class="{ 'task-ac--checked': ac.checked }">
                    <input type="checkbox" :disabled="!editable" :checked="ac.checked"
                           @change="toggleAc(i)" />
                    <template x-if="taskEditing('ac', i) && !pane.disk">
                      <div class="task-field-edit">
                        <input type="text" x-model="taskEdit.value"
                               @keydown.enter="saveTaskEdit()" @keydown.escape="cancelTaskEdit()" />
                        <div class="task-field-actions">
                          <button type="button" class="editor-btn-save" :disabled="!!taskSavingField"
                                  @click="saveTaskEdit()">Save</button>
                          <button type="button" @click="cancelTaskEdit()">Cancel</button>
                        </div>
                      </div>
                    </template>
                    <template x-if="!taskEditing('ac', i) || pane.disk">
                      <span class="task-ac-text" x-text="ac.text"></span>
                    </template>
                    <span class="task-ac-actions" x-show="editable && !taskEditing('ac', i)">
                      <button type="button" @click="beginTaskEdit('ac', ac.text, i)" title="Edit">&#9998;</button>
                      <button type="button" @click="removeAc(i)" title="Remove">&times;</button>
                    </span>
                  </li>
                </template>
              </ul>
              <input x-show="editable" type="text" class="task-inline-input task-ac-add"
                     placeholder="+ add criterion" x-model="taskAcDraft"
                     @keydown.enter="addAc(taskAcDraft)" />
            </section>

            <section class="task-deps" x-show="!pane.disk && pane.card.dependencies.length">
              <h2>Dependencies</h2>
              <ul>
                <template x-for="depId of pane.card.dependencies" :key="depId">
                  <li>
                    <a :class="{ 'task-dep--offboard': !dependencyCard(depId) }"
                       :href="dependencyCard(depId) ? ('?view=' + view + '&task=' + encodeURIComponent(depId)) : null"
                       @click.prevent="dependencyCard(depId) && openTask(depId)"
                       x-text="dependencyCard(depId)
                         ? dependencyCard(depId).rawId + ' — ' + dependencyCard(depId).title
                         : depId.toUpperCase() + ' (not on this board)'"></a>
                  </li>
                </template>
              </ul>
            </section>

            <section class="task-chain" x-show="!pane.disk && currentTaskChain()">
              <h2>
                Dependency chain
                <a class="chain-context-link" href="?view=chains" @click.prevent="showChains()">View full chains &rarr;</a>
              </h2>
              <div class="chain-rows chain-rows--mini">
                <template x-for="row of (currentTaskChain() ? currentTaskChain().rows : [])" :key="row.key">
                  <div class="chain-row"
                       :class="{ 'chain-row--backref': row.backref, 'chain-row--offboard': row.offboard,
                                 'chain-row--current': row.id === currentTaskId }"
                       @click="!row.offboard && row.id !== currentTaskId && openTask(row.id)">
                    <span class="chain-prefix" x-text="row.prefix"></span>
                    <span class="chain-backref-mark" x-show="row.backref" title="Shown in full above">&uarr;</span>
                    <span class="chain-id" x-text="row.rawId"></span>
                    <span class="chain-row-title" x-text="row.offboard ? '(not on this board)' : row.title"></span>
                  </div>
                </template>
              </div>
            </section>

            <section class="task-block task-notes" x-show="pane.card.notes || editable">
              <h2>
                Implementation Notes
                <span class="task-block-actions">
                  <button type="button" x-show="editable && !taskEditing('notes')"
                          @click="beginTaskEdit('notes', pane.card.notes)" title="Edit">&#9998;</button>
                  <template x-if="pane.disk">
                    <span>
                      <button type="button" @click="copyText(pane.card.notes)" title="Copy">&#9099;</button>
                      <button type="button" @click="takeDiskText('notes', pane.card.notes)"
                              title="Take the disk version">&larr;</button>
                    </span>
                  </template>
                </span>
              </h2>
              <template x-if="taskEditing('notes') && !pane.disk">
                <div class="task-field-edit">
                  <textarea rows="8" x-model="taskEdit.value" @keydown.escape="cancelTaskEdit()"></textarea>
                  <div class="task-field-actions">
                    <button type="button" class="editor-btn-save" :disabled="!!taskSavingField"
                            @click="saveTaskEdit()">Save</button>
                    <button type="button" @click="cancelTaskEdit()">Cancel</button>
                  </div>
                </div>
              </template>
              <div class="markdown" x-show="!taskEditing('notes') || pane.disk"
                   x-html="renderTaskMarkdown(pane.card.notes)" @click="onContentClick($event)"></div>
            </section>
          </article>
        </template>
      </div>
    </aside>
    </div>
  </body>
</html>
